[project]
name = "searxng"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaurav Kumar", email = "24f1000758@ds.study.iitm.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bsedata>=0.6.0",
    "fastapi>=0.139.0",
    "fastmcp>=3.4.4",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "huggingface-hub>=1.23.0",
    "nsepython>=2.97",
    "numpy>=2.4.6",
    "onnxruntime>=1.27.0",
    "openai>=2.41.0",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "tokenizers>=0.23.1",
    "trafilatura>=2.1.0",
    "uvicorn>=0.51.0",
    "websockets>=16.1",
    "yfinance>=1.5.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
